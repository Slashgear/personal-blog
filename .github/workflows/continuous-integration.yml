name: Continous Integration

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: "Build 📦"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
        with:
          package-manager: bun@1.4.0
      - name: Check format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test
      - name: Upload dist for audits
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: "Deploy 🚀"
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  audits:
    needs: build
    runs-on: ubuntu-latest
    name: "Audits 🔍"
    # Runs alongside deploy, not before it: these are reporting-only checks
    # (see continue-on-error below on each step) and shouldn't add minutes
    # to the deploy critical path. Serves the downloaded dist/ with a plain
    # static server, so this job never needs `bun install`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Lighthouse CI
        # Budgets live in .lighthouserc.json (mostly `warn`, a few `error`).
        # Still continue-on-error: the flaky part is the temporary-public-
        # storage upload, not the assertions — flip this to `false` once the
        # warn-level findings are burned down and gating is wanted.
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: "./.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Accessibility audit (pa11y)
        # Non-blocking for now: pa11y-ci's default threshold is 0, so any
        # finding across the whole sitemap exits non-zero, and some older
        # posts already have real WCAG issues to work through. Reporting
        # only until there's a plan to burn down the backlog.
        # Runs via npx so Puppeteer's postinstall always downloads
        # Chromium, regardless of the runner's script-execution policy.
        continue-on-error: true
        run: |
          python3 -m http.server 4321 --directory dist &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && break; sleep 1; done
          npx --yes pa11y-ci@4.1.1 \
            --config ./.pa11yci.json \
            --sitemap http://localhost:4321/sitemap-0.xml \
            --sitemap-find "https://blog.slashgear.dev" \
            --sitemap-replace "http://localhost:4321"
