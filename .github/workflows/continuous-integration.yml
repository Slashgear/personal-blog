name: Continous Integration

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: "Build 📦"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
        with:
          package-manager: bun@latest
      - name: Check format
        run: bun run format:check
      - name: Lighthouse CI
        # Non-blocking for now: no score assertions are configured, so this
        # only reports. continue-on-error is an extra safety net so a flaky
        # upload to temporary public storage can never fail the build.
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: "./.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Accessibility audit (pa11y)
        # Non-blocking for now: pa11y-ci's default threshold is 0, so any
        # finding across the whole sitemap exits non-zero, and some older
        # posts already have real WCAG issues to work through. Reporting
        # only until there's a plan to burn down the backlog.
        # Runs via npx (not the project's bun-installed pa11y-ci) so
        # Puppeteer's postinstall always downloads Chromium, regardless of
        # bun's script-execution policy.
        continue-on-error: true
        run: |
          bun run preview -- --port 4321 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && break; sleep 1; done
          npx --yes pa11y-ci@4.1.1 \
            --config ./.pa11yci.json \
            --sitemap http://localhost:4321/sitemap-0.xml \
            --sitemap-find "https://blog.slashgear.dev" \
            --sitemap-replace "http://localhost:4321"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: "Deploy 🚀"
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
